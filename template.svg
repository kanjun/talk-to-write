<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 160" width="480" height="320" role="img" aria-label="Talk to Write: a draft with a spoken suggestion">
  <title>Talk to Write</title>
  <rect width="240" height="160" rx="14" fill="#F1E7D4"/>
  <!-- app window -->
  <rect x="18" y="14" width="150" height="132" rx="9" fill="#FBF6EC" stroke="#2A2220" stroke-opacity="0.18"/>
  <!-- tabs -->
  <rect x="26" y="22" width="38" height="12" rx="6" fill="#EADFCB"/>
  <text x="45" y="31" font-family="Georgia, serif" font-size="7" fill="#2A2220" fill-opacity="0.6" text-anchor="middle">Talk</text>
  <rect x="68" y="22" width="42" height="12" rx="6" fill="#2A2220"/>
  <text x="89" y="31" font-family="Georgia, serif" font-size="7" fill="#FBF6EC" text-anchor="middle">Canvas</text>
  <rect x="114" y="22" width="44" height="12" rx="6" fill="#EADFCB"/>
  <text x="136" y="31" font-family="Georgia, serif" font-size="7" fill="#2A2220" fill-opacity="0.6" text-anchor="middle">Garden</text>
  <!-- document title and text -->
  <text x="28" y="52" font-family="Georgia, serif" font-size="10" font-weight="bold" fill="#2A2220">The quiet hour</text>
  <rect x="28" y="59" width="128" height="3.5" rx="1.75" fill="#2A2220" fill-opacity="0.22"/>
  <rect x="28" y="67" width="118" height="3.5" rx="1.75" fill="#2A2220" fill-opacity="0.22"/>
  <!-- crossed-out words and the spoken suggestion under them -->
  <rect x="28" y="75" width="74" height="3.5" rx="1.75" fill="#2A2220" fill-opacity="0.22"/>
  <line x1="28" y1="76.75" x2="102" y2="76.75" stroke="#3B6FB6" stroke-width="1.2"/>
  <rect x="25" y="82" width="136" height="24" rx="5" fill="#3B6FB6" fill-opacity="0.12" stroke="#3B6FB6" stroke-opacity="0.5"/>
  <rect x="31" y="88" width="120" height="3.5" rx="1.75" fill="#3B6FB6" fill-opacity="0.7"/>
  <rect x="31" y="96" width="84" height="3.5" rx="1.75" fill="#3B6FB6" fill-opacity="0.7"/>
  <rect x="122" y="94.5" width="16" height="7" rx="3.5" fill="#3B6FB6"/>
  <path d="M126.5 98 l2 2 l3.5 -3.6" fill="none" stroke="#FBF6EC" stroke-width="1.1" stroke-linecap="round" stroke-linejoin="round"/>
  <rect x="28" y="114" width="124" height="3.5" rx="1.75" fill="#2A2220" fill-opacity="0.22"/>
  <rect x="28" y="122" width="100" height="3.5" rx="1.75" fill="#2A2220" fill-opacity="0.22"/>
  <rect x="28" y="130" width="112" height="3.5" rx="1.75" fill="#2A2220" fill-opacity="0.22"/>
  <!-- speaking: mic with sound waves -->
  <path d="M168 60 C 182 60, 186 70, 196 76" fill="none" stroke="#D26645" stroke-width="1.4" stroke-dasharray="2 3" stroke-linecap="round"/>
  <circle cx="204" cy="92" r="22" fill="#D26645"/>
  <rect x="198.5" y="78" width="11" height="18" rx="5.5" fill="#FBF6EC"/>
  <path d="M194 91 a10 10 0 0 0 20 0" fill="none" stroke="#FBF6EC" stroke-width="2.2" stroke-linecap="round"/>
  <line x1="204" y1="101" x2="204" y2="106" stroke="#FBF6EC" stroke-width="2.2" stroke-linecap="round"/>
  <path d="M176 82 q-4 10 0 20" fill="none" stroke="#D26645" stroke-width="2" stroke-linecap="round" stroke-opacity="0.55"/>
  <path d="M232 82 q4 10 0 20" fill="none" stroke="#D26645" stroke-width="2" stroke-linecap="round" stroke-opacity="0.55"/>
  <!-- a spoken line -->
  <rect x="178" y="122" width="52" height="16" rx="8" fill="#FBF6EC" stroke="#2A2220" stroke-opacity="0.18"/>
  <rect x="185" y="128.5" width="22" height="3" rx="1.5" fill="#D26645" fill-opacity="0.8"/>
  <rect x="210" y="128.5" width="13" height="3" rx="1.5" fill="#D26645" fill-opacity="0.5"/>
