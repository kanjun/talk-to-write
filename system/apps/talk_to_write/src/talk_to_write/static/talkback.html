<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Talk back</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Newsreader:opsz,wght@6..72,400;6..72,500&display=swap" rel="stylesheet">
<style>
:root {
  --paper: #FBF6EC; --card: #FFFDF8; --ink: #2A2220; --muted: #8A7E74; --line: #E8DFD0;
  --accent: #C2452D; --soft: #F3EADB;
  --sans: ui-sans-serif, system-ui, sans-serif; --serif: "Newsreader", Georgia, serif;
}
* { box-sizing: border-box; }
html, body { margin: 0; height: 100%; background: var(--paper); color: var(--ink); font-family: var(--sans); }
.wrap { height: 100%; display: flex; flex-direction: column; }
.top { display: flex; align-items: center; gap: 8px; padding: 10px 14px; border-bottom: 1px solid var(--line); overflow-x: auto; flex: none; }
.label { font-size: 11px; letter-spacing: .12em; font-weight: 700; color: var(--muted); text-transform: uppercase; margin-right: 4px; flex: none; }
.pill { flex: none; border: 1px solid var(--line); background: var(--card); color: var(--ink); border-radius: 999px; padding: 7px 14px; font: 600 14px var(--sans); cursor: pointer; }
.pill.on { background: var(--accent); border-color: var(--accent); color: #fff; }
.sep { flex: none; width: 1px; align-self: stretch; background: var(--line); margin: 0 6px; }
.body { flex: 1; display: flex; min-height: 0; }
.side { width: 260px; flex: none; border-right: 1px solid var(--line); padding: 16px 18px; overflow-y: auto; }
.dial { margin: 14px 0 20px; }
.dial .ends { display: flex; justify-content: space-between; font-size: 14px; color: var(--ink); margin-bottom: 6px; }
input[type=range] { width: 100%; accent-color: var(--accent); }
.main { flex: 1; display: flex; flex-direction: column; min-width: 0; }
.log { flex: 1; overflow-y: auto; padding: 22px 26px 10px; }
.empty { color: var(--muted); font-family: var(--serif); font-size: 18px; max-width: 520px; margin: 40px auto; line-height: 1.5; text-align: center; }
.me { margin: 14px 0 18px auto; max-width: 78%; background: var(--soft); border-radius: 14px; padding: 12px 16px; font-size: 16px; line-height: 1.45; white-space: pre-wrap; width: fit-content; }
.them { margin: 6px 0 22px; max-width: 720px; }
.them .tag { font-size: 12px; letter-spacing: .12em; font-weight: 700; color: var(--accent); text-transform: uppercase; margin-bottom: 6px; }
.them .text { font-family: var(--serif); font-size: 18px; line-height: 1.5; white-space: pre-wrap; }
.room { display: flex; flex-wrap: wrap; align-items: center; gap: 6px; padding: 10px 26px; border-bottom: 1px solid var(--line); font-size: 13px; }
.room .lbl { color: var(--muted); margin-right: 2px; }
.room .chip { display: inline-flex; align-items: center; gap: 4px; border-radius: 999px; padding: 4px 6px 4px 11px; font-weight: 600; color: #fff; }
.room .chip button { border: 0; background: none; color: inherit; opacity: .8; cursor: pointer; font-size: 15px; padding: 0 3px; line-height: 1; }
.room .you { border: 1px solid var(--line); background: var(--card); border-radius: 999px; padding: 4px 11px; }
.room .add { border: 1px dashed var(--muted); background: none; border-radius: 999px; padding: 4px 11px; font: 600 13px var(--sans); color: var(--ink); cursor: pointer; }
.picker { padding: 10px 26px 12px; border-bottom: 1px solid var(--line); background: var(--card); }
.picker input { width: 100%; max-width: 360px; border: 1px solid var(--line); border-radius: 8px; padding: 8px 10px; font: 15px var(--sans); background: #fff; }
.picker .ideas { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 8px; }
.picker .ideas button { border: 1px solid var(--line); background: var(--paper); border-radius: 999px; padding: 4px 11px; font: 13px var(--sans); cursor: pointer; color: var(--ink); }
.picker .hint { font-size: 12px; color: var(--muted); margin-top: 8px; }
.them .tag.person { letter-spacing: 0; text-transform: none; font-size: 14px; }
.joined { text-align: center; font-size: 12px; color: var(--muted); margin: 4px 0 16px; }
.note { font-size: 11px; color: var(--muted); margin: -14px 0 20px; }
.thinking { color: var(--muted); font-size: 14px; margin: 6px 0 20px; }
.thinking::after { content: "..."; animation: dots 1.2s steps(3) infinite; display: inline-block; width: 1.2em; overflow: hidden; vertical-align: bottom; }
@keyframes dots { from { width: 0 } to { width: 1.2em } }
.say { display: flex; gap: 8px; padding: 10px 18px calc(12px + env(safe-area-inset-bottom)); border-top: 1px solid var(--line); }
.say textarea { flex: 1; border: 1px solid var(--line); border-radius: 12px; padding: 11px 14px; font: 16px/1.4 var(--sans); background: #fff; resize: none; height: 48px; max-height: 160px; outline: none; }
.say button { flex: none; border: 0; border-radius: 12px; padding: 0 16px; font: 600 15px var(--sans); cursor: pointer; }
#mic { background: var(--card); border: 1px solid var(--line); color: var(--ink); }
#mic.on { background: var(--accent); color: #fff; border-color: var(--accent); }
#send { background: var(--ink); color: #fff; }
.dials-toggle { display: none; }
@media (max-width: 700px) {
  .body { flex-direction: column; }
  .side { width: auto; border-right: 0; border-bottom: 1px solid var(--line); padding: 4px 16px 8px; max-height: 45vh; }
  .side.shut .inner { display: none; }
  .dials-toggle { display: block; width: 100%; border: 0; background: none; text-align: left; padding: 8px 0; font: 700 11px var(--sans); letter-spacing: .12em; color: var(--muted); }
  .side > .label { display: none; }
  .log { padding: 16px 14px 8px; }
  .room, .picker { padding-left: 14px; padding-right: 14px; }
  .me { max-width: 90%; }
}
</style>
</head>
<body>
<div class="wrap" id="wrap">
  <div class="top">
    <span class="label">Mode</span>
    <span class="modes" id="modes" style="display:contents"></span>
  </div>
  <div class="body">
    <div class="side" id="side">
      <button class="dials-toggle" id="dialsToggle">Show dials</button>
      <div class="label">Dials</div>
      <div class="inner">
        <div id="dials"></div>
      </div>
    </div>
    <div class="main">
      <div class="room" id="room"></div>
      <div class="picker" id="picker" hidden>
        <input id="addName" placeholder="Anyone, living or not. Type a name, then Enter">
        <div class="ideas" id="ideas"></div>
        <div class="hint">They answer as an imagined take in that person's spirit, not real quotes.</div>
      </div>
      <div class="log" id="log"><div class="empty" id="empty">Say or type a thought. Bring people into the conversation above, and steer everyone with the mode and dials.</div></div>
      <div class="say">
        <textarea id="box" placeholder="Message"></textarea>
        <button id="mic" title="Talk instead of typing">Talk</button>
        <button id="send">Send</button>
      </div>
    </div>
  </div>
</div>
<script>
const MODES = [
  ["off", "Normal", ""],
  ["find", "Find what I mean", "Finding what you mean"],
  ["clarify", "Clarify", "Clarifying"],
  ["expand", "Expand", "Expanding"],
  ["challenge", "Challenge", "Challenging"],
  ["usable", "Make it usable", "Making it usable"],
];
const DIALS = [
  ["affirm", "Affirm", "Challenge", 50],
  ["explore", "Explore", "Solve", 50],
  ["grounded", "Grounded", "Wild", 50],
  ["fast", "Fast", "Deep", 30],
  ["asks", "Asks first", "Goes ahead", 50],
];
const IDEAS = ["Kim Kardashian", "Rick Rubin", "Björk", "Werner Herzog", "Ira Glass", "Stewart Brand", "Miuccia Prada"];
const COLORS = ["#C2452D", "#3D6B8C", "#5E7A3A", "#8A5A9E"];
const MAX_ROOM = 4;
const saved = JSON.parse(localStorage.getItem("talkback2") || "{}");
const state = {
  mode: saved.mode || "off",
  dials: Object.assign(Object.fromEntries(DIALS.map(d => [d[0], d[3]])), saved.dials || {}),
  room: [],
  messages: [],
};
const color = {};
const $ = id => document.getElementById(id);
const save = () => localStorage.setItem("talkback2", JSON.stringify({ mode: state.mode, dials: state.dials }));
const el = (tag, cls, text) => { const e = document.createElement(tag); if (cls) e.className = cls; if (text != null) e.textContent = text; return e; };
const log = $("log");
const scrollDown = () => { log.scrollTop = log.scrollHeight; };

function drawTop() {
  const box = $("modes"); box.innerHTML = "";
  for (const [key, label] of MODES) {
    const b = el("button", "pill" + (key === state.mode ? " on" : ""), label);
    b.onclick = () => { state.mode = key; save(); drawTop(); };
    box.appendChild(b);
  }
}

function drawDials() {
  const box = $("dials"); box.innerHTML = "";
  for (const [key, left, right] of DIALS) {
    const d = el("div", "dial");
    const ends = el("div", "ends"); ends.append(el("span", null, left), el("span", null, right));
    const r = el("input"); r.type = "range"; r.min = 0; r.max = 100; r.value = state.dials[key];
    r.oninput = () => { state.dials[key] = +r.value; save(); };
    d.append(ends, r); box.appendChild(d);
  }
}

function note(text) {
  $("empty")?.remove();
  state.messages.push({ role: "note", text });
  log.appendChild(el("div", "joined", text)); scrollDown();
}

function drawRoom() {
  const box = $("room"); box.innerHTML = "";
  box.append(el("span", "lbl", "In the conversation:"), el("span", "you", "You"));
  if (!state.room.length) box.appendChild(el("span", "you", "Your partner"));
  for (const name of state.room) {
    const c = el("span", "chip", name); c.style.background = color[name];
    const x = el("button", null, "×"); x.title = `Ask ${name} to leave`;
    x.onclick = () => { state.room = state.room.filter(n => n !== name); note(`${name} left`); drawRoom(); };
    c.appendChild(x); box.appendChild(c);
  }
  if (state.room.length < MAX_ROOM) {
    const add = el("button", "add", "+ Add someone");
    add.onclick = () => { $("picker").hidden = !$("picker").hidden; if (!$("picker").hidden) { drawIdeas(); $("addName").focus(); } };
    box.appendChild(add);
  }
}

function join(name) {
  name = name.trim();
  if (!name || state.room.includes(name) || state.room.length >= MAX_ROOM) return;
  color[name] = color[name] || COLORS[Object.keys(color).length % COLORS.length];
  state.room.push(name); $("picker").hidden = true; $("addName").value = "";
  note(`${name} joined`); drawRoom();
}

function drawIdeas() {
  const box = $("ideas"); box.innerHTML = "";
  for (const name of IDEAS.filter(n => !state.room.includes(n))) {
    const b = el("button", null, name); b.onclick = () => join(name); box.appendChild(b);
  }
}
$("addName").addEventListener("keydown", e => {
  if (e.key === "Enter") join(e.target.value);
  if (e.key === "Escape") $("picker").hidden = true;
});
$("dialsToggle").onclick = () => { const shut = $("side").classList.toggle("shut"); $("dialsToggle").textContent = shut ? "Show dials" : "Hide dials"; };
if (matchMedia("(max-width: 700px)").matches) $("side").classList.add("shut"); else $("dialsToggle").textContent = "Hide dials";

async function send() {
  stopMic();
  const text = $("box").value.trim(); if (!text) return;
  $("box").value = ""; $("empty")?.remove();
  state.messages.push({ role: "me", text });
  log.appendChild(el("div", "me", text));
  const room = [...state.room];
  const waitText = room.length ? `${room.join(" and ")} ${room.length > 1 ? "are" : "is"} thinking` : (MODES.find(m => m[0] === state.mode)[2] || "Thinking");
  const wait = el("div", "thinking", waitText);
  log.appendChild(wait); scrollDown();
  const body = { messages: state.messages, dials: state.dials, mode: state.mode, room };
  let out;
  try {
    const r = await fetch("/api/talkback", { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify(body) });
    out = await r.json();
    if (!r.ok) throw new Error(out.error || "No answer came back.");
  } catch (err) {
    wait.className = "joined"; wait.textContent = err.message; return;
  }
  wait.remove();
  const modeTag = MODES.find(m => m[0] === out.mode)?.[2];
  for (const t of out.turns) {
    const div = el("div", "them");
    const tag = t.name ? el("div", "tag person", t.name) : el("div", "tag", modeTag || "");
    if (t.name) tag.style.color = color[t.name];
    if (tag.textContent) div.appendChild(tag);
    div.appendChild(el("div", "text", t.error ? "Didn't answer this time." : t.text));
    log.appendChild(div);
    if (!t.error) state.messages.push({ role: "them", name: t.name || undefined, text: t.text });
  }
  scrollDown();
}
$("send").onclick = send;
$("box").addEventListener("keydown", e => { if (e.key === "Enter" && !e.shiftKey) { e.preventDefault(); send(); } });

let rec = null, before = "";
function stopMic() { if (rec) { const r = rec; rec = null; r.stop(); } $("mic").classList.remove("on"); $("mic").textContent = "Talk"; }
$("mic").onclick = () => {
  if (rec) return stopMic();
  const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
  if (!SR) { $("box").placeholder = "Talking isn't available in this browser; type instead."; return; }
  const me = rec = new SR(); rec.continuous = true; rec.interimResults = true; rec.lang = "en-US";
  before = $("box").value ? $("box").value.trim() + " " : "";
  rec.onresult = e => {
    if (rec !== me) return;
    let said = ""; for (const r of e.results) said += r[0].transcript;
    $("box").value = before + said.trim();
  };
  rec.onend = () => { if (rec === me) stopMic(); };
  rec.start(); $("mic").classList.add("on"); $("mic").textContent = "Stop";
};

drawTop(); drawDials(); drawRoom();
</script>
{{SHELL_PAGE_SCRIPT}}
</body>
</html>
