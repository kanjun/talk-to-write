# Machine-readable manifest for this template. The sibling
# template.md holds the prose, the Requirements list, and the two
# append-only history logs; this file is authoritative for everything
# below. Both are generated together -- validate_template.py fails if
# they disagree.
format = "v2"

[template]
slug = "talk-to-write"
title = "Talk to Write"
description = "Talk out loud and turn the best of what you say into essays in your own voice"
thumbnail = "template.svg"
version = "v1"

# How this template is DERIVED from the workspace it came from. An
# update re-runs this recipe rather than diffing two repos, which is what
# keeps an exclusion excluded even though the thing still exists upstream.
[recipe]
include = ["system/apps/talk_to_write", "system/supervisord.conf.d/talk-to-write.conf", ".agents/skills/talk-to-write", ".agents/skills/suggest-voice-edits"]
data_include = []
exclude = [
    "data/.apps/talk-to-write (the publisher's documents, chats, recordings, histories and voice bank)",
    "data/memories (the publisher's voice notes)",
    "the publisher's notes folder and its synced-folder path (the Garden's folder is a setting with no default)",
    "the publisher's voice-sample folders and the file-name deny and allow lists tuned to them in build_voice_bank.py",
    "the voice-bank readers for the publisher's private chat-export and meeting-recording formats",
]
modification_rules = [
    "replace the publisher's name and pronouns everywhere (UI copy, prompts, skills, docstrings, tests) with a neutral 'the user' / 'you' / 'they'",
    "make the Garden's notes folder a setting (TALK_TO_WRITE_NOTES_FOLDER or notes_folder in the app's settings.json) with no default, and show a 'connect a notes folder' message when it is unset",
    "rename the publisher-named notes tab to 'Garden' everywhere (UI, API routes, side names, comments, skill text)",
    "remove every link to or mention of the publisher's personal site; describe a note marked publish: true only as 'marked public'",
    "make voice-sample sources a setting (voice_sources in the app's settings.json) with no default; with none set, voice edits run without voice examples",
    "remove hardcoded paths under the publisher's home folder, references to the publisher's memory files, quoted passages of the publisher's writing, and the publisher's essay titles",
    "replace real people's names in examples and test fixtures with invented names",
    "remove hard dependencies on the publisher's other apps (website editor, knowledge corpus and the like)",
]

# Everything an adopter must deal with before this is really theirs.
# One list -- but each entry's KIND says how it is handled, because the
# two are handled at different times by different mechanisms:
#
#   permission / secret / llm = ACTIVATION. The adopting agent acts on
#   these FIRST and BY ITSELF, initiating each latchkey permission
#   request and each secret request before asking the user anything.
#   Every one of them must have a matching requires_ line in template.md
#   and vice versa -- the validator checks that, because an adopter once
#   never got prompted for a permission the app needed.
#
#   The [[requirements.secret]] entries below were AGGREGATED from the
#   included apps' app.toml [[secrets]] and skills' SKILL.md secrets:
#   declarations, plus every data/.secrets/<file>.env the included
#   mcp-servers.json and supervisord programs run under. Fix a wrong one
#   at its declaration, not here.
#
#   adaptation = worked through INTERACTIVELY with the user afterwards.
#   Prose on both sides, so it is not cross-checked.
#
[requirements]

[requirements.llm]
method = "keyless"

[[requirements.adaptation]]
summary = "no notes folder is connected, so the Garden tab is empty"
resolution = "ask whether the user keeps an Obsidian-style notes folder; if so set notes_folder in data/.apps/talk-to-write/settings.json (or TALK_TO_WRITE_NOTES_FOLDER) and restart the app"

[[requirements.adaptation]]
summary = "no voice samples are configured, so voice edits are much weaker and carry no quote"
resolution = "ask where the user's finished writing lives, list those folders under voice_sources in the settings file with a kind each, and run build_voice_bank.py"

[[requirements.adaptation]]
summary = "the talk-back 'who to invite' suggestions are the publisher's picks of public figures"
resolution = "offer to replace ROOM_IDEAS in static/app.js and IDEAS in static/talkback.html with people the user admires"

# What the included code needs INSTALLED. apt takes bare names: versions
# are a function of the apt snapshot timestamp, so replaying names at the
# adopter's timestamp yields versions consistent with the rest of their
# environment. The other sources are not snapshot-pinned, so for them the
# recorded version IS the pin (name = version).
#
[environment]
apt = []
env_d_units = []
